[package]
name = "epsilon-merkle"
version = "0.1.0"
edition = "2021"
description = "Mesh-stored Merkle tree for Solana ZK Compression (EpsilonChat)"
license = "MIT"

# epsilon-merkle is part of the main deltachat workspace

[lib]
name = "epsilon_merkle"
crate-type = ["rlib", "staticlib"]

[dependencies]
# Iroh P2P transport
iroh = "1.0"
iroh-base = "1.0"
iroh-gossip = "0.101"

# Solana RPC
solana-sdk = "2.1"
solana-rpc-client = "2.1"
solana-transaction-status = "2.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
bincode = "1"

# Crypto (shared with Solana + Iroh)
ed25519-dalek = "2"
sha2 = "0.10"

# Async + utils
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
data-encoding = "2"
axum = "0.7"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = { version = "8", features = ["axum"] }
hex = "0.4"
bs58 = "0.5"